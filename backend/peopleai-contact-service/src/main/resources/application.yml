server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: peopleai-contact-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/peopleai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:peopleai}
    password: ${MYSQL_PASSWORD:local_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
