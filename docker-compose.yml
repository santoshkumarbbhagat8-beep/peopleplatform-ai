services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: peopleai
      MYSQL_USER: peopleai
      MYSQL_PASSWORD: local_dev_change_me
      MYSQL_ROOT_PASSWORD: local_root_change_me
    ports: ["3306:3306"]
    volumes: ["peopleai_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal_root_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["9092:9092"]
  auth-service:
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: peopleai-auth-service } }
    environment: { SERVER_PORT: 8081 }
    ports: ["8081:8081"]
  jobs-service:
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: peopleai-jobs-service } }
    environment:
      SERVER_PORT: 8082
      MYSQL_URL: jdbc:mysql://mysql:3306/peopleai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: peopleai
      MYSQL_PASSWORD: local_dev_change_me
    depends_on: { mysql: { condition: service_healthy } }
    ports: ["8082:8082"]
  candidates-service:
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: peopleai-candidates-service } }
    environment:
      SERVER_PORT: 8083
      MYSQL_URL: jdbc:mysql://mysql:3306/peopleai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: peopleai
      MYSQL_PASSWORD: local_dev_change_me
    depends_on: { mysql: { condition: service_healthy } }
    ports: ["8083:8083"]
  contact-service:
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: peopleai-contact-service } }
    environment:
      SERVER_PORT: 8084
      MYSQL_URL: jdbc:mysql://mysql:3306/peopleai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: peopleai
      MYSQL_PASSWORD: local_dev_change_me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_started }
    ports: ["8084:8084"]
  api-gateway:
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: peopleai-api-gateway } }
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      JOBS_SERVICE_URL: http://jobs-service:8082
      CANDIDATES_SERVICE_URL: http://candidates-service:8083
      CONTACT_SERVICE_URL: http://contact-service:8084
    depends_on: [auth-service, jobs-service, candidates-service, contact-service]
    ports: ["8080:8080"]
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    depends_on: [api-gateway]
    ports: ["3000:80"]
volumes:
  peopleai_mysql:
